<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificador - Salón de la Fama</title>
    
    <!-- Librerías de React y Tailwind para que funcione en un solo archivo -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Iconos integrados para no depender de librerías externas
        const CalcIcon = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6 md:w-7 md:h-7 text-indigo-600 mt-1 md:mt-0 flex-shrink-0"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16.01" y1="10" y2="10"/><line x1="16" x2="16.01" y1="14" y2="14"/><line x1="16" x2="16.01" y1="18" y2="18"/><line x1="8" x2="8.01" y1="10" y2="10"/><line x1="8" x2="8.01" y1="14" y2="14"/><line x1="8" x2="8.01" y1="18" y2="18"/><line x1="12" x2="12.01" y1="10" y2="10"/><line x1="12" x2="12.01" y1="14" y2="14"/><line x1="12" x2="12.01" y1="18" y2="18"/></svg>;
        const UsersIcon = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const UserIcon = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const RotateIcon = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        const PlusIcon = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
        const TrashIcon = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-3 h-3"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;

        function App() {
            const [groupGrades, setGroupGrades] = useState({
                rigor: 4, contexto: 4, digital: 4, equipo: 4
            });

            const [students, setStudents] = useState([
                { id: 1, name: 'Alumno 1', comunicacion: 4, defensa: 4 },
                { id: 2, name: 'Alumno 2', comunicacion: 4, defensa: 4 },
                { id: 3, name: 'Alumno 3', comunicacion: 4, defensa: 4 },
                { id: 4, name: 'Alumno 4', comunicacion: 4, defensa: 4 }
            ]);

            const WEIGHTS = {
                rigor: 2.5, contexto: 1.5, digital: 1.0, equipo: 1.0,
                comunicacion: 2.0, defensa: 2.0
            };

            const calculatePoints = (value, maxPoints) => {
                return (value / 4) * maxPoints;
            };

            const groupScore = 
                calculatePoints(groupGrades.rigor, WEIGHTS.rigor) +
                calculatePoints(groupGrades.contexto, WEIGHTS.contexto) +
                calculatePoints(groupGrades.digital, WEIGHTS.digital) +
                calculatePoints(groupGrades.equipo, WEIGHTS.equipo);

            const getStudentScore = (student) => {
                const individualScore = 
                calculatePoints(student.comunicacion, WEIGHTS.comunicacion) +
                calculatePoints(student.defensa, WEIGHTS.defensa);
                return (groupScore + individualScore).toFixed(2);
            };

            const updateGroup = (field, value) => {
                setGroupGrades({ ...groupGrades, [field]: value });
            };

            const updateStudent = (id, field, value) => {
                setStudents(students.map(s => s.id === id ? { ...s, [field]: value } : s));
            };

            const addStudent = () => {
                const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;
                setStudents([...students, { id: newId, name: `Alumno ${newId}`, comunicacion: 4, defensa: 4 }]);
            };

            const removeStudent = (id) => {
                setStudents(students.filter(s => s.id !== id));
            };

            const resetAll = () => {
                if(confirm('¿Estás segura de que quieres limpiar todas las notas?')) {
                setGroupGrades({ rigor: 4, contexto: 4, digital: 4, equipo: 4 });
                setStudents([
                    { id: 1, name: 'Alumno 1', comunicacion: 4, defensa: 4 },
                    { id: 2, name: 'Alumno 2', comunicacion: 4, defensa: 4 },
                    { id: 3, name: 'Alumno 3', comunicacion: 4, defensa: 4 },
                    { id: 4, name: 'Alumno 4', comunicacion: 4, defensa: 4 }
                ]);
                }
            };

            const GradeButtons = ({ value, onChange }) => {
                return (
                <div className="flex flex-wrap gap-2 mt-2 sm:mt-0">
                    <button onClick={() => onChange(1)} className={`flex-1 sm:flex-none px-3 py-1.5 text-sm font-medium rounded transition-colors ${value === 1 ? 'bg-red-500 text-white shadow-md' : 'bg-red-50 text-red-700 hover:bg-red-100 border border-red-200'}`}>
                    1 - Insuficiente
                    </button>
                    <button onClick={() => onChange(2)} className={`flex-1 sm:flex-none px-3 py-1.5 text-sm font-medium rounded transition-colors ${value === 2 ? 'bg-orange-500 text-white shadow-md' : 'bg-orange-50 text-orange-700 hover:bg-orange-100 border border-orange-200'}`}>
                    2 - Adecuado
                    </button>
                    <button onClick={() => onChange(3)} className={`flex-1 sm:flex-none px-3 py-1.5 text-sm font-medium rounded transition-colors ${value === 3 ? 'bg-blue-500 text-white shadow-md' : 'bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200'}`}>
                    3 - Bueno
                    </button>
                    <button onClick={() => onChange(4)} className={`flex-1 sm:flex-none px-3 py-1.5 text-sm font-medium rounded transition-colors ${value === 4 ? 'bg-emerald-500 text-white shadow-md' : 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200'}`}>
                    4 - Excelente
                    </button>
                </div>
                );
            };

            return (
                <div className="p-4 md:p-8 max-w-5xl mx-auto space-y-6">
                
                <header className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col md:flex-row items-start md:items-center justify-between">
                    <div className="flex-1">
                    <h1 className="text-xl md:text-2xl font-bold text-slate-800 flex items-start md:items-center gap-2">
                        <CalcIcon />
                        <span>Calificador de la situación de aprendizaje "El salón de la fama de las funciones".</span>
                    </h1>
                    <div className="mt-2 ml-0 md:ml-9">
                        <p className="text-slate-700 font-medium text-base">Matemáticas Generales · 1º Bachillerato.</p>
                        <p className="text-slate-500 text-sm mt-1">Profesora: Cristina Ramos García.</p>
                    </div>
                    </div>
                    <button onClick={resetAll} className="mt-4 md:mt-0 flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors flex-shrink-0">
                    <RotateIcon /> Limpiar Todo
                    </button>
                </header>

                <section className="bg-white rounded-xl shadow-sm border border-indigo-100 overflow-hidden">
                    <div className="bg-indigo-50 border-b border-indigo-100 p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 sm:gap-0">
                    <h2 className="text-lg font-semibold text-indigo-900 flex items-center gap-2">
                        <UsersIcon /> 1. Calificación grupal del proyecto.
                    </h2>
                    <div className="bg-white px-3 py-1 rounded-md text-sm font-bold text-indigo-700 shadow-sm border border-indigo-200">
                        Subtotal: {groupScore.toFixed(2)} / 6.00
                    </div>
                    </div>
                    
                    <div className="p-4 space-y-4">
                    <div className="flex flex-col md:flex-row md:items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-100 gap-3 md:gap-0">
                        <div>
                        <div className="font-semibold text-gray-800">Rigor Matemático</div>
                        <div className="text-xs text-gray-500 uppercase tracking-wide font-medium mt-0.5">Peso: 25% (Máx 2.5 pts)</div>
                        </div>
                        <GradeButtons value={groupGrades.rigor} onChange={(v) => updateGroup('rigor', v)} />
                    </div>

                    <div className="flex flex-col md:flex-row md:items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-100 gap-3 md:gap-0">
                        <div>
                        <div className="font-semibold text-gray-800">Contexto y Aplicaciones</div>
                        <div className="text-xs text-gray-500 uppercase tracking-wide font-medium mt-0.5">Peso: 15% (Máx 1.5 pts)</div>
                        </div>
                        <GradeButtons value={groupGrades.contexto} onChange={(v) => updateGroup('contexto', v)} />
                    </div>

                    <div className="flex flex-col md:flex-row md:items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-100 gap-3 md:gap-0">
                        <div>
                        <div className="font-semibold text-gray-800">Competencia Digital (Canva/GeoGebra)</div>
                        <div className="text-xs text-gray-500 uppercase tracking-wide font-medium mt-0.5">Peso: 10% (Máx 1.0 pts)</div>
                        </div>
                        <GradeButtons value={groupGrades.digital} onChange={(v) => updateGroup('digital', v)} />
                    </div>

                    <div className="flex flex-col md:flex-row md:items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-100 gap-3 md:gap-0">
                        <div>
                        <div className="font-semibold text-gray-800">Trabajo en Equipo y Tiempo</div>
                        <div className="text-xs text-gray-500 uppercase tracking-wide font-medium mt-0.5">Peso: 10% (Máx 1.0 pts)</div>
                        </div>
                        <GradeButtons value={groupGrades.equipo} onChange={(v) => updateGroup('equipo', v)} />
                    </div>
                    </div>
                </section>

                <section className="bg-white rounded-xl shadow-sm border border-emerald-100 overflow-hidden">
                    <div className="bg-emerald-50 border-b border-emerald-100 p-4 flex justify-between items-center">
                    <h2 className="text-lg font-semibold text-emerald-900 flex items-center gap-2">
                        <UserIcon /> 2. Calificación individual de la exposición.
                    </h2>
                    <button onClick={addStudent} className="flex items-center gap-1 text-sm bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-md transition-colors">
                        <PlusIcon /> Añadir
                    </button>
                    </div>
                    
                    <div className="divide-y divide-gray-100">
                    {students.map((student) => (
                        <div key={student.id} className="p-5 hover:bg-emerald-50/30 transition-colors">
                        <div className="flex flex-col lg:flex-row gap-6">
                            
                            <div className="lg:w-1/4 flex flex-col justify-between">
                            <div>
                                <label className="text-xs text-gray-500 font-bold uppercase mb-1 block">Nombre del Alumno</label>
                                <input type="text" value={student.name} onChange={(e) => updateStudent(student.id, 'name', e.target.value)} className="w-full border-gray-300 rounded-md shadow-sm focus:border-emerald-500 focus:ring-emerald-500 text-lg font-medium p-2 border" />
                            </div>
                            
                            <div className="mt-4 bg-slate-800 text-white p-3 rounded-lg flex items-center justify-between shadow-sm">
                                <span className="text-sm font-medium text-slate-300">NOTA FINAL</span>
                                <span className="text-2xl font-bold">{getStudentScore(student)}</span>
                            </div>

                            <button onClick={() => removeStudent(student.id)} className="mt-3 text-xs text-red-500 hover:text-red-700 flex items-center gap-1 w-fit">
                                <TrashIcon /> Eliminar alumno
                            </button>
                            </div>

                            <div className="lg:w-3/4 space-y-3">
                            <div className="flex flex-col md:flex-row md:items-center justify-between p-3 bg-white border border-gray-200 rounded-lg shadow-sm gap-3 md:gap-0">
                                <div>
                                <div className="font-semibold text-gray-800">Dominio y Comunicación</div>
                                <div className="text-xs text-gray-500 uppercase tracking-wide font-medium mt-0.5">Peso: 20% (Máx 2.0 pts)</div>
                                </div>
                                <GradeButtons value={student.comunicacion} onChange={(v) => updateStudent(student.id, 'comunicacion', v)} />
                            </div>

                            <div className="flex flex-col md:flex-row md:items-center justify-between p-3 bg-white border border-gray-200 rounded-lg shadow-sm gap-3 md:gap-0">
                                <div>
                                <div className="font-semibold text-gray-800">Defensa y Preguntas</div>
                                <div className="text-xs text-gray-500 uppercase tracking-wide font-medium mt-0.5">Peso: 20% (Máx 2.0 pts)</div>
                                </div>
                                <GradeButtons value={student.defensa} onChange={(v) => updateStudent(student.id, 'defensa', v)} />
                            </div>
                            </div>
                            
                        </div>
                        </div>
                    ))}
                    
                    {students.length === 0 && (
                        <div className="p-8 text-center text-gray-500">
                        No hay alumnos añadidos. Pulsa en "Añadir" para empezar.
                        </div>
                    )}
                    </div>
                </section>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
